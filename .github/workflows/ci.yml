name: EasyCode checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
      - run: uv sync --frozen --extra dev --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
      - run: uv sync --frozen --extra dev --python 3.12
      - run: docker build -f Dockerfile.runner -t easycode-python:latest .
      - run: uv run pytest tests/test_runners.py -q
