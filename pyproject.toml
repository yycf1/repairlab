[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easycode"
version = "0.1.0"
description = "EasyCode: pi-style minimal coding agent — hand-written loop, native tool_calls, four tools, sandboxed bash, chat-first workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "httpx>=0.27,<1", "jinja2>=3.1.6,<4", "python-dotenv>=1.0,<2", "packaging>=24"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
easycode = "easycode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/easycode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
